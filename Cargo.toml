[workspace]
resolver = "2"
members = [
    "crates/kurasi-core",
    "crates/kurasi-pdf",
    "crates/kurasi-server",
    "src-tauri",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"
authors = ["Dimas Prameshwara"]
repository = "https://github.com/dotasp/kurasi"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
