[package]
name = "kurasi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Kurasi: reference curation desktop app (Tauri 2 shell, CLI, MCP entry point)"
build = "build.rs"

[[bin]]
name = "kurasi"
path = "src/main.rs"

[lib]
name = "kurasi_shell"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The core library, the HTTP and MCP server, and the pdfium backend. bridge.rs is the only
# module that names them.
kurasi-core = { path = "../crates/kurasi-core" }
kurasi-server = { path = "../crates/kurasi-server" }
kurasi-pdf = { path = "../crates/kurasi-pdf" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "signal"] }
log = { version = "0.4", features = ["std"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }
